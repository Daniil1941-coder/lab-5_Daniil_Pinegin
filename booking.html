<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registan Travel · Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">🕌 Registan <span>Travel</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="booking.html" class="active">Booking</a>
        <a href="booking.html" class="btn btn-gold">Book now</a>
    </nav>
</header>

<main class="booking">
    <h1>Book a tour</h1>
    <p class="subtitle">Fill in the form and we will contact you within 24 hours.</p>

    <form id="booking-form" novalidate>
        <div class="field">
            <label for="name" class="required">Full name</label>
            <input type="text" id="name" placeholder="e.g. Aziz Karimov">
        </div>

        <div class="field">
            <label for="email" class="required">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>

        <div class="field">
            <label for="tour" class="required">Tour</label>
            <select id="tour">
                <option value="35">Old Tashkent Walk — 35 USD</option>
                <option value="120">Registan &amp; Gur-e-Amir — 120 USD</option>
                <option value="210">Khiva Itchan Kala — 210 USD</option>
            </select>
        </div>

        <div class="field">
            <label for="travellers" class="required">Number of travellers</label>
            <input type="number" id="travellers" min="1" max="12" value="1">
        </div>

        <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date">
        </div>

        <p id="total" class="total"></p>

        <button type="submit" class="btn">Send request</button>

        <p id="message" class="message"></p>
    </form>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Registan Travel · Tashkent, Uzbekistan</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
